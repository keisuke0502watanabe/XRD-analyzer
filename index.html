<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="XRD">
<meta name="theme-color" content="#ffffff">
<title>XRD Analyzer</title>
<!-- Always point the stable root URL at the current build. Bump this on each version. -->
<meta http-equiv="refresh" content="0; url=./xrd_analyzer_v27.html">
<link rel="canonical" href="./xrd_analyzer_v27.html">
<script>
// Redirect to the pinned build; if it 404s (e.g. this file was not bumped with
// the app), fall back to the newest xrd_analyzer_vNN.html the server lists.
(function(){
  var pinned='./xrd_analyzer_v27.html';
  fetch(pinned,{method:'HEAD'}).then(function(r){
    if(r.ok){location.replace(pinned);return;}
    return fetch('./').then(function(x){return x.text();}).then(function(t){
      var m=t.match(/xrd_analyzer_v(\d+)\.html/g)||[];
      var best=null,bn=-1;
      m.forEach(function(f){var n=+f.replace(/\D+/g,'');if(n>bn){bn=n;best=f;}});
      if(best){document.title='XRD Analyzer ('+best+')';location.replace('./'+best);}
    });
  }).catch(function(){location.replace(pinned);});
})();
</script>
</head>
<body>
<p>Opening XRD Analyzer… If nothing happens, <a href="./xrd_analyzer_v27.html">tap here</a>.</p>
</body>
</html>
